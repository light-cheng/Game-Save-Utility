name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --all-targets

      - name: Clippy check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release assets
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Extract Tag and Version
        id: vars
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "asset_base=GameSaveUtility-$tag-windows-x64" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Game Save Utility ${{ steps.vars.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/${{ steps.vars.outputs.asset_base }}.exe
            target/release/${{ steps.vars.outputs.asset_base }}.zip
            target/release/${{ steps.vars.outputs.asset_base }}.sha256
